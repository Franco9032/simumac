<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="340" height="90">
  <defs>
    <linearGradient id="simumac-line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Línea de crecimiento de fondo (PIB ascendente, sutil) -->
  <polyline points="4,62 16,58 28,60 40,50 52,52 64,38 76,42 88,26"
            fill="none" stroke="url(#simumac-line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Icono: 4 canales interconectados en rombo (Fiscal, Monetario, Crédito, Externa) -->
  <g stroke-width="1.6" fill="none">
    <!-- conexiones -->
    <line x1="46" y1="18" x2="24" y2="45" stroke="#8a8f98" stroke-opacity="0.55"/>
    <line x1="46" y1="18" x2="68" y2="45" stroke="#8a8f98" stroke-opacity="0.55"/>
    <line x1="24" y1="45" x2="46" y2="72" stroke="#8a8f98" stroke-opacity="0.55"/>
    <line x1="68" y1="45" x2="46" y2="72" stroke="#8a8f98" stroke-opacity="0.55"/>
    <line x1="24" y1="45" x2="68" y2="45" stroke="#8a8f98" stroke-opacity="0.35"/>
    <line x1="46" y1="18" x2="46" y2="72" stroke="#8a8f98" stroke-opacity="0.35"/>
  </g>

  <!-- Fiscal (arriba) -->
  <circle cx="46" cy="18" r="8" fill="#1D9E75"/>
  <!-- Monetario (izquierda) -->
  <circle cx="24" cy="45" r="8" fill="#378ADD"/>
  <!-- Crédito (derecha) -->
  <circle cx="68" cy="45" r="8" fill="#7A5FC7"/>
  <!-- Externa (abajo) -->
  <circle cx="46" cy="72" r="8" fill="#D85A30"/>
  <!-- Núcleo de síntesis (centro) -->
  <circle cx="46" cy="45" r="4.5" fill="#1c2431"/>

  <!-- Wordmark -->
  <text x="106" y="52" font-family="-apple-system,'SF Pro Display',Helvetica,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-1" fill="#1c2431">Simu<tspan fill="#1D9E75">Mac</tspan></text>
  <text x="107" y="68" font-family="-apple-system,'SF Pro Text',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" letter-spacing=".5" fill="#6e6e73">SIMULADOR MACROECONÓMICO · BOLIVIA 2010–2014</text>
</svg>
